services:
  - type: web
    name: nexora-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w apps/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: MONGODB_URI
        sync: false
      - key: API_PROXY_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
